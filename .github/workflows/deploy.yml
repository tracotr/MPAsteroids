name: Deploy

# Builds both halves of the game here, then sends the finished files to the
# Ubuntu host and restarts the service.
#
# Both halves go out together on purpose. They share a packet format, so a new
# client talking to an old server cannot read asteroid updates. Never deploy one
# without the other.
#
# Files are sent with tar over SSH rather than rsync, which has to be installed
# at both ends. tar and ssh are on every image.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A second run would otherwise overwrite the first half-way through copying.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # The browser dials the public HTTPS port and Caddy forwards to the port the
  # game server binds. They are different numbers, which is why both are set
  # here rather than left to the Makefile defaults.
  PUBLIC_HOST: asteroids.jaxon-king.com
  PUBLIC_PORT: "443"
  PUBLIC_PATH: /ws
  GAME_SERVER_PORT: "25665"

  # Where the systemd unit expects the binary, and where Caddy serves files from.
  REMOTE_BIN_DIR: ~/MPAsteroids/MPAsteroids
  REMOTE_WEB_ROOT: /var/www/mpasteroids

jobs:
  deploy:
    # Older than the host would produce a binary the host's glibc cannot load, so
    # this wants to be no newer than the Ubuntu release on the VM.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # lib/libraylib.web.a is a prebuilt archive in the repo. If a future
      # Emscripten release stops linking against it, pin this to the version it
      # was built with rather than chasing the error.
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build web client
        run: |
          make -C MPAsteroids web \
            SERVER_HOST='${{ env.PUBLIC_HOST }}' \
            SERVER_PUBLIC_PORT='${{ env.PUBLIC_PORT }}' \
            SERVER_PATH='${{ env.PUBLIC_PATH }}'

      - name: Build game server
        run: |
          make -C MPAsteroids server SERVER_PORT=${{ env.GAME_SERVER_PORT }}

      # Catches the mistake that costs the most time to diagnose: a client built
      # pointing at localhost, which only fails once it is live in a browser.
      - name: Check the build targets production
        run: |
          cd MPAsteroids
          for f in mpasteroids.html mpasteroids.js mpasteroids.wasm mpasteroids.data mpasteroids-server; do
            test -s "$f" || { echo "missing build output: $f"; exit 1; }
          done
          grep -q '${{ env.PUBLIC_HOST }}' mpasteroids.wasm \
            || { echo "client was not built for ${{ env.PUBLIC_HOST }}"; exit 1; }
          if grep -q '127\.0\.0\.1' mpasteroids.wasm; then
            echo "client still points at localhost"; exit 1
          fi
          echo "client targets ${{ env.PUBLIC_HOST }}:${{ env.PUBLIC_PORT }}${{ env.PUBLIC_PATH }}"
          echo "server binds ${{ env.GAME_SERVER_PORT }}"

      - name: Authorise SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Everything lands in the home directory first. The deploy user owns the
      # web root but not its parent, so a staging directory cannot be created
      # beside it, and the running binary is replaced rather than written over.
      - name: Send the built files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"

          tar -czf - -C MPAsteroids \
              mpasteroids.html mpasteroids.js mpasteroids.wasm mpasteroids.data \
            | $SSH "$DEPLOY_USER@$DEPLOY_HOST" \
                'rm -rf ~/mpasteroids-incoming && mkdir -p ~/mpasteroids-incoming && tar -xzf - -C ~/mpasteroids-incoming'

          tar -czf - -C MPAsteroids mpasteroids-server \
            | $SSH "$DEPLOY_USER@$DEPLOY_HOST" \
                'tar -xzf - -C ~/mpasteroids-incoming'

          $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'ls -l ~/mpasteroids-incoming'

      - name: Install and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -euo pipefail <<REMOTE
          # Keep the previous set in home, where this user can write.
          rm -rf ~/mpasteroids-previous
          cp -a ${{ env.REMOTE_WEB_ROOT }} ~/mpasteroids-previous || true

          cp -a ~/mpasteroids-incoming/mpasteroids.html \
                ~/mpasteroids-incoming/mpasteroids.js \
                ~/mpasteroids-incoming/mpasteroids.wasm \
                ~/mpasteroids-incoming/mpasteroids.data \
                ${{ env.REMOTE_WEB_ROOT }}/
          chmod -R o+rX ${{ env.REMOTE_WEB_ROOT }}

          # mv rather than cp: the old binary is still running, and replacing the
          # directory entry is allowed where writing over the file is not.
          mkdir -p ${{ env.REMOTE_BIN_DIR }}
          chmod +x ~/mpasteroids-incoming/mpasteroids-server
          mv -f ~/mpasteroids-incoming/mpasteroids-server ${{ env.REMOTE_BIN_DIR }}/mpasteroids-server

          rm -rf ~/mpasteroids-incoming

          # Disconnects everyone playing. Unavoidable: the packet format is
          # shared, so the server cannot lag behind the client just deployed.
          sudo systemctl restart mpasteroids
          REMOTE

      - name: Check it came back up
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          sleep 3
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "systemctl is-active --quiet mpasteroids && echo 'game server running' || (journalctl -u mpasteroids -n 30 --no-pager; exit 1)"

          code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ env.PUBLIC_HOST }}/mpasteroids.html")
          echo "site returned HTTP $code"
          test "$code" = "200"
